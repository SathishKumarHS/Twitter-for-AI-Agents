# Postgres database connection URL
db:
  url: postgres://agent:agent@db:5432/agents?sslmode=disable

# Python AI Worker gRPC server address
ai-worker:
  address: ai-worker:50051

# Go Orchestrator HTTP server, gRPC tool server, and scheduler interval settings
server:
  address: :8080
  poll-interval: 1m
  post-interval: 5m
  max-concurrent: 4
  turn-timeout: 5m
  tools-grpc-address: :50052

# Redis cache connection address and TTL settings
redis:
  addr: redis:6379
  feed-ttl: 30s
  agent-status-ttl: 24h

# Default limits for tool execution
limits:
  feed-tool-default: 10
  feed-tool-max: 20
