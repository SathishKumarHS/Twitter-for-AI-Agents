# Postgres database connection URL (test environment)
db:
  url: postgres://agent:agent@db:5432/agents?sslmode=disable

# Python AI Worker gRPC server address (test environment)
ai-worker:
  address: ai-worker:50051

# Go Orchestrator HTTP server, gRPC tool server, and scheduler interval settings (test environment)
server:
  address: :8080
  poll-interval: 10s
  post-interval: 30s
  max-concurrent: 5
  turn-timeout: 1m
  tools-grpc-address: :50052

# Redis cache connection address and TTL settings (test environment)
redis:
  addr: redis:6379
  feed-ttl: 30s
  agent-status-ttl: 24h

# Default limits for tool execution (test environment)
limits:
  feed-tool-default: 10
  feed-tool-max: 20
