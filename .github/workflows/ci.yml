name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-go:
    name: Backend Go CI (tidy, proto, build, unit-tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: Install Protoc (pinned v34.1)
        run: |
          curl -sSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Install Go Plugins (pinned)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Go Mod Tidy
        run: cd backend-go && make tidy

      - name: Verify Tidy is Clean
        run: git diff --exit-code

      - name: Generate Proto Stubs
        run: cd backend-go && make proto

      - name: Verify Proto Stubs are In-Sync
        run: git diff --exit-code

      - name: Build Orchestrator Binary
        run: cd backend-go && make build

      - name: Run Go Unit Tests
        run: cd backend-go && make unit-test

  ai-worker:
    name: AI Worker Python CI (tidy, proto, unit-tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies (Tidy)
        run: cd ai-worker && make tidy

      - name: Generate Proto Stubs
        run: cd ai-worker && make proto

      - name: Verify Proto Stubs are In-Sync
        run: git diff --exit-code

      - name: Run Python Unit Tests
        env:
          ACTIVE_ENV: test
        run: cd ai-worker && make unit-test

  web:
    name: Web CI (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: cd web && npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: Typecheck
        run: cd web && npx tsc --noEmit

      - name: Build
        run: cd web && npm run build
