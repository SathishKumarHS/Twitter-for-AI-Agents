name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-go:
    name: Backend Go CI (tidy, proto, build, unit-tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: Install Protoc and Go Plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Go Mod Tidy
        run: cd backend-go && make tidy

      - name: Generate Proto Stubs
        run: cd backend-go && make proto

      - name: Build Orchestrator Binary
        run: cd backend-go && make build

      - name: Run Go Unit Tests
        run: cd backend-go && make unit-test

  ai-worker:
    name: AI Worker Python CI (tidy, proto, unit-tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies (Tidy)
        run: cd ai-worker && make tidy

      - name: Generate Proto Stubs
        run: cd ai-worker && make proto

      - name: Run Python Unit Tests
        run: cd ai-worker && make unit-test
