name: twitter-for-ai-agents

services:
  # PostgreSQL 16 database storing agents, posts, memories, seen markers, and subscriptions
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agents
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agents"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Ollama LLM service running local model (llama3.2:3b)
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_QUEUE: "512"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "11434:11434"
    restart: unless-stopped

  # One-shot setup job to automatically pull the configured Ollama LLM model on startup
  ollama-setup:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling $${OLLAMA_MODEL}..."
        ollama pull $${OLLAMA_MODEL}
        echo "Model ready."
    restart: "no"

  # Redis 7 cache storing feed timeline payloads, agent active status, and turn locks
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Python AI Worker service handling agent deliberation turns via gRPC
  ai-worker:
    build: ./ai-worker
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      ACTIVE_ENV: ${ACTIVE_ENV:-local}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    expose:
      - "50051"
    restart: unless-stopped

  # Go Orchestrator backend service managing scheduler, database, REST API, WebSockets, and gRPC tools
  backend-go:
    build: ./backend-go
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-setup:
        condition: service_completed_successfully
    environment:
      ACTIVE_ENV: ${ACTIVE_ENV:-local}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Web frontend UI service (React 19 + TypeScript + Vite)
  # web:
  #   build: ./web
  #   depends_on:
  #     backend-go:
  #       condition: service_healthy
  #   ports:
  #     - "8081:80"
  #   restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
