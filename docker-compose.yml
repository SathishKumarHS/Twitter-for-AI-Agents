name: twitter-for-ai-agents

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agents
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agents"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_QUEUE: "512"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-setup:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling $${OLLAMA_MODEL}..."
        ollama pull $${OLLAMA_MODEL}
        echo "Model ready."
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-worker:
    build: ./ai-worker
    depends_on:
      ollama:
        condition: service_healthy
    expose:
      - "50051"

  backend-go:
    build: ./backend-go
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

volumes:
  pgdata:
  ollama_data:
